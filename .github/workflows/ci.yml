# SPDX-License-Identifier: GPL-3.0-or-later
# Build, test and package on Linux, Windows and macOS (Apple silicon and Intel)
# on every push and pull request. A red run blocks merging (branch protection).
name: CI

# Cost control: every push runs the fast Linux checks (audit, build + all tests incl. UI,
# sanitizers). The full matrix (Windows, both macOS, other distributions, OCCT from source,
# publishing) runs on pull requests, pushes to main, weekly, on demand (Actions tab ▸ CI ▸
# Run workflow), and on pushes whose message contains [full ci]. macOS minutes cost about
# 10x Linux minutes.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0) from this run; empty: no release"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    name: License audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/license_audit.py

  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-data-exchange-dev \
            libocct-foundation-dev libtbb-dev libeigen3-dev libboost-dev nlohmann-json3-dev \
            libgtest-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libgl-dev libfreetype-dev libharfbuzz-dev xvfb xauth libgl1-mesa-dri \
            libfuse2 file
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test (including UI workflow tests under Xvfb)
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1600x1000x24" ctest --test-dir build --output-on-failure -j4
      - name: Benchmarks
        run: ./build/bench/jigsmith-bench | tee bench-linux.json
      - name: GUI smoke test and screenshot
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          xvfb-run -a -s "-screen 0 1600x1000x24" ./build/app/jigsmith --sample phone_stand \
            --screenshot screenshot-linux.png
      - name: Package AppImage
        run: |
          cmake --install build --prefix AppDir/usr
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps \
            AppDir/usr/share/icons/hicolor/256x256/apps
          cp packaging/linux/jigsmith.desktop AppDir/usr/share/applications/
          cp packaging/linux/jigsmith.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          # appimagetool (since late October 2026) makes .DirIcon only from a PNG or XPM
          cp packaging/linux/jigsmith.png AppDir/usr/share/icons/hicolor/256x256/apps/
          cp packaging/linux/jigsmith.png AppDir/jigsmith.png
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLo linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE=/usr/lib/qt6/bin/qmake
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            -d AppDir/usr/share/applications/jigsmith.desktop \
            -i AppDir/usr/share/icons/hicolor/scalable/apps/jigsmith.svg \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/jigsmith.png
          ls -la *.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: jigsmith-linux
          path: |
            *.AppImage
            screenshot-linux.png
            build/ui-*.png
            bench-linux.json

  sanitizers:
    name: Linux sanitizers (ASan + UBSan, core only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-data-exchange-dev \
            libocct-foundation-dev libtbb-dev libeigen3-dev libboost-dev nlohmann-json3-dev libgtest-dev libfreetype-dev libharfbuzz-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DJIG_BUILD_GUI=OFF -DJIG_BUILD_BENCH=OFF -DJIG_SANITIZE=address,undefined
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -j4
        env:
          # leak checking on; only OCCT's STEP registries (kept for the whole process) are suppressed
          ASAN_OPTIONS: detect_leaks=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  macos:
    name: macOS (${{ matrix.arch }})
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: Apple silicon
          - os: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja opencascade qt eigen boost nlohmann-json googletest freetype harfbuzz pkgconf
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix)"
      - name: Build
        run: cmake --build build
      - name: Test (UI tests need a display session; they run in the Linux job)
        run: ctest --test-dir build --output-on-failure -j3 -LE ui
      - name: Benchmarks
        run: ./build/bench/jigsmith-bench | tee bench-macos.json
      - name: GUI smoke test and screenshot (B-003)
        # the real window, opened on the runner's desktop session; it renders the phone stand
        # sample, saves a screenshot and quits
        run: |
          ./build/app/jigsmith.app/Contents/MacOS/jigsmith --sample phone_stand \
            --screenshot "screenshot-${{ matrix.os }}.png" &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "timed out"; exit 1; fi
          wait $pid
          test -s "screenshot-${{ matrix.os }}.png"
      - name: Package .dmg (unsigned)
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/app/jigsmith.app -dmg
          mv build/app/jigsmith.dmg "Jigsmith-${{ matrix.os }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: jigsmith-${{ matrix.os }}
          path: |
            Jigsmith-*.dmg
            screenshot-*.png
            bench-macos.json

  macos-universal:
    # B-005: one app for both kinds of Mac. Homebrew's Apple-silicon and Intel libraries differ
    # in version, so their two apps cannot be joined; this builds everything for both
    # architectures at once instead: the official (universal) Qt, OCCT and FreeType from source
    # (cached), Eigen, Boost and nlohmann/json headers from Homebrew. No HarfBuzz yet (letters
    # are placed one by one). Tested natively and under Rosetta, then packaged.
    name: macOS universal
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    runs-on: macos-15
    env:
      ARCHS: arm64;x86_64
      UNI: ${{ github.workspace }}/deps/universal
    steps:
      - uses: actions/checkout@v4
      - name: Header-only dependencies and tools
        run: brew install ninja eigen boost nlohmann-json
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Cache universal OCCT and FreeType
        id: uni-cache
        uses: actions/cache@v4
        with:
          path: deps/universal
          key: macos-universal-occt-7.9.3-freetype-2.13.3-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Build FreeType and OCCT for both architectures
        if: steps.uni-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ft.tar.xz https://download.savannah.gnu.org/releases/freetype/freetype-2.13.3.tar.xz
          tar -xf ft.tar.xz
          cmake -S freetype-2.13.3 -B ft-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
            -DCMAKE_INSTALL_PREFIX="$UNI" -DBUILD_SHARED_LIBS=ON -DFT_DISABLE_ZLIB=ON -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_PNG=ON -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON
          cmake --build ft-build && cmake --install ft-build
          JIG_OCCT_PREFIX="$UNI" JIG_OCCT_CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=$ARCHS" sh scripts/build-occt.sh 7.9.3
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$ARCHS" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$UNI;$(brew --prefix)" -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - name: Build
        run: cmake --build build
      - name: Both halves are there
        run: lipo -archs build/app/jigsmith.app/Contents/MacOS/jigsmith | grep -q "x86_64 arm64"
      - name: Test natively, and the core again under Rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          export DYLD_LIBRARY_PATH="$UNI/lib"
          ctest --test-dir build --output-on-failure -j3 -LE ui
          arch -x86_64 ./build/tests/test_features
      - name: Package .dmg (unsigned) and open it both ways
        run: |
          export DYLD_LIBRARY_PATH="$UNI/lib"
          "$QT_ROOT_DIR/bin/macdeployqt" build/app/jigsmith.app -libpath="$UNI/lib"
          lipo -archs build/app/jigsmith.app/Contents/Frameworks/libTKernel*.dylib
          unset DYLD_LIBRARY_PATH
          for arch in arm64 x86_64; do
            arch -$arch build/app/jigsmith.app/Contents/MacOS/jigsmith --sample phone_stand \
              --screenshot "screenshot-universal-$arch.png" &
            pid=$!
            for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then kill $pid; echo "timed out ($arch)"; exit 1; fi
            wait $pid
            test -s "screenshot-universal-$arch.png"
          done
          hdiutil create -volname Jigsmith -srcfolder build/app/jigsmith.app -ov -format UDZO Jigsmith-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: jigsmith-macos-universal
          path: |
            Jigsmith-macos-universal.dmg
            screenshot-universal-*.png

  windows:
    name: Windows (x64)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd /C CALL {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (conda-forge, prebuilt OCCT)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: packaging/windows/environment.yml
          activate-environment: jigsmith
      - name: Install Qt (official LGPL binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        # (with debug info, so a crash in CI can be read with the debugger)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo "-DCMAKE_PREFIX_PATH=%CONDA_PREFIX%\Library;%QT_ROOT_DIR%"
      - name: Build
        run: cmake --build build
      - name: Test (UI tests run in the Linux job)
        run: ctest --test-dir build --output-on-failure -j4 -LE ui
      - name: Benchmarks
        run: build\bench\jigsmith-bench.exe > bench-windows.json && type bench-windows.json
      - name: Package portable zip (unverified on a clean machine)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/app/jigsmith.exe, build/cli/jigsmith-cli.exe dist/
          # OCCT and its runtime dependencies from the conda environment
          Copy-Item "$env:CONDA_PREFIX/Library/bin/*.dll" dist/
          windeployqt --release --no-translations dist/jigsmith.exe
          # B-011: only the DLLs something loads, each conda-forge one listed with its licence
          pwsh packaging/windows/trim-dlls.ps1 -Dist dist -CondaPrefix $env:CONDA_PREFIX
          Get-Content dist/THIRD_PARTY_DLLS.txt
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.md dist/
          Compress-Archive -Path dist/* -DestinationPath Jigsmith-windows-x64-portable.zip
      - name: GUI smoke test and screenshot (B-003)
        # The runner has no GPU driver, and Windows' own OpenGL is 1.1, so a copy of the app
        # gets Mesa's software OpenGL (llvmpipe, from mesa-dist-win; CI only, never shipped).
        # It renders the phone stand sample, saves a screenshot and must quit cleanly.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force gltest, mesa | Out-Null
          Copy-Item -Recurse dist/* gltest/
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -D mesa
          7z x (Get-ChildItem mesa/*.7z)[0].FullName -omesa/x -y | Out-Null
          Copy-Item mesa/x/x64/*.dll gltest/
          # Qt loads opengl32.dll only from System32 (Windows' GL 1.1), so Mesa goes in as
          # Qt's software OpenGL, opengl32sw.dll, and the app is told to use it.
          Copy-Item -Force mesa/x/x64/opengl32.dll gltest/opengl32sw.dll
          $env:QT_OPENGL = "software"
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process -FilePath gltest/jigsmith.exe -ArgumentList "--sample", "phone_stand", "--screenshot", "$PWD\screenshot-windows.png" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "timed out" }
          if ($p.ExitCode -ne 0) {
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (Test-Path $cdb) {
              & $cdb -g -G -lines -y "build\app" -c ".ecxr; kn 40; q" gltest\jigsmith.exe --sample phone_stand --screenshot "$PWD\screenshot-windows.png" 2>&1 | Select-Object -Last 60
            }
            throw "exit code $($p.ExitCode)"
          }
          if ((Get-Item screenshot-windows.png).Length -lt 10000) { throw "screenshot too small" }
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = (& build/cli/jigsmith-cli.exe --version).Trim()
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$PWD\dist" packaging/windows/jigsmith.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item Jigsmith-windows-x64-setup.exe
      - name: Install silently and run the installed copy
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\jigsmith-installed"
          $p = Start-Process -FilePath .\Jigsmith-windows-x64-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$dir", "/TASKS=associate" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          & "$dir\jigsmith-cli.exe" --run samples/phone_stand.jigs --report -
          if ($LASTEXITCODE -ne 0) { throw "installed jigsmith-cli failed" }
          if (-not (Test-Path "$dir\jigsmith.exe")) { throw "jigsmith.exe missing" }
          $assoc = (Get-ItemProperty "HKCU:\Software\Classes\.jig")."(default)"
          if ($assoc -ne "Jigsmith.Design") { throw ".jig association missing" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\jigsmith.exe") { throw "uninstall left the program behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: jigsmith-windows
          path: |
            Jigsmith-windows-x64-portable.zip
            Jigsmith-windows-x64-setup.exe
            screenshot-windows.png
            bench-windows.json

  distros:
    # Builds and tests inside other distributions' official images, using only
    # scripts/install-deps.sh, so the "build from source" instructions stay true.
    # No JavaScript actions here: they cannot run in musl containers.
    name: Linux ${{ matrix.name }}
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Void (glibc)
            image: ghcr.io/void-linux/void-glibc-full:latest
            prep: xbps-install -Syu xbps && xbps-install -Sy git ca-certificates
          - name: Void (musl)
            image: ghcr.io/void-linux/void-musl-full:latest
            prep: xbps-install -Syu xbps && xbps-install -Sy git ca-certificates
          - name: Fedora
            image: fedora:latest
            prep: dnf install -y git
          - name: Arch
            image: archlinux:latest
            prep: pacman -Syu --noconfirm git
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
            # the minimal image ships busybox-gawk, which blocks real gawk (needed via Qt's cups deps)
            prep: zypper --non-interactive install --force-resolution git gzip tar gawk
    steps:
      - name: Get git
        run: ${{ matrix.prep }}
      - name: Check out (plain git)
        run: |
          git init -q src && cd src
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - name: Install dependencies with scripts/install-deps.sh
        run: cd src && sh scripts/install-deps.sh --yes
      - name: Configure
        run: cd src && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cd src && cmake --build build
      - name: Test (headless; UI tests run in the Linux job)
        run: cd src && ctest --test-dir build --output-on-failure -j4 -LE ui

  flatpak:
    # B-007: the Flatpak manifest builds (OCCT from source, cached by flatpak-builder) and is
    # bundled; the CLI inside the sandbox then runs the phone stand sample.
    name: Flatpak
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.8
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Jigsmith.flatpak
          manifest-path: packaging/flatpak/io.github.Redgale.Jigsmith.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/io.github.Redgale.Jigsmith.yml') }}
      - name: Run the CLI inside the sandbox
        run: |
          flatpak install -y --noninteractive --bundle Jigsmith.flatpak
          cp samples/phone_stand.jigs /tmp/
          flatpak run --command=jigsmith-cli --filesystem=/tmp io.github.Redgale.Jigsmith \
            --run /tmp/phone_stand.jigs --report -

  occt-from-source:
    # For distributions without an OCCT package: scripts/build-occt.sh, then Jigsmith.
    name: Linux, OCCT built from source
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install everything except OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libeigen3-dev libboost-dev \
            nlohmann-json3-dev libgtest-dev libx11-dev libgl-dev libfreetype-dev libharfbuzz-dev
      - name: Cache OCCT build
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: deps/occt
          key: occt-src-${{ hashFiles('scripts/build-occt.sh') }}
      - name: Build OCCT with scripts/build-occt.sh
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: scripts/build-occt.sh
      - name: Configure, build and test Jigsmith (core + CLI)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJIG_BUILD_GUI=OFF -DCMAKE_PREFIX_PATH="$PWD/deps/occt"
          cmake --build build
          ctest --test-dir build --output-on-failure -j4

  publish:
    # Rolling pre-release with the latest green build for every platform, downloadable
    # without a GitHub account: https://github.com/<owner>/<repo>/releases/tag/continuous
    name: Publish builds (a version tag's release, or the continuous pre-release)
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[full ci]'))) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: [linux, macos, macos-universal, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-continuous
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' -o -name '*-setup.exe' \) -exec cp {} upload/ \;
          for f in upload/*.AppImage; do mv "$f" upload/Jigsmith-linux-x86_64.AppImage; done
          cp artifacts/jigsmith-linux/screenshot-linux.png upload/ || true
          ls -la upload
      - name: Publish the release for this version tag
        # a pushed v* tag, or a run started by hand with a release tag (the tag is made here, at
        # this run's commit)
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          # the notes: this version's section of CHANGELOG.md (checked out at the tag)
          version="${TAG#v}"
          awk -v v="## $version" '$0 ~ "^"v {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" upload/* --title "Jigsmith $version" --notes-file notes.md --target "${{ github.sha }}"
      - name: Replace the continuous pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete continuous --yes --cleanup-tag || true
          cat > notes.md <<NOTES
          Development build of Jigsmith from commit ${{ github.sha }} (branch ${{ github.ref_name }}).
          A development build after the latest release (see CHANGELOG.md and docs/STATUS.md). These builds are **unsigned**:
          - **Linux**: \`chmod +x Jigsmith-linux-x86_64.AppImage\` then run it (x86_64, glibc).
          - **macOS**: open the .dmg (Apple silicon: \`Jigsmith-macos-15.dmg\`; Intel: \`Jigsmith-macos-15-intel.dmg\`). Gatekeeper will warn: right-click the app, choose Open.
          - **Windows**: run \`Jigsmith-windows-x64-setup.exe\` (installs for you only, no administrator rights needed), or unzip \`Jigsmith-windows-x64-portable.zip\` and run \`jigsmith.exe\`. SmartScreen may warn.
          Other Linux distributions (Void, Fedora, Arch, openSUSE…): build from source, see README.
